[package]
name = "engine_render"
description = "wgpu renderer: camera-relative large-world rendering, textured PBR meshes, cascaded shadows, sky, post-processing, extensible render features, headless screenshots, image and glTF loaders."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine_core.workspace = true
engine_assets.workspace = true
engine_world.workspace = true
bevy_ecs.workspace = true
# Fast hash maps for per-object work each frame.
bevy_platform.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true
image.workspace = true
gltf = { workspace = true, features = ["KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform", "extensions"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
raw-window-handle.workspace = true
crossbeam-channel.workspace = true
sha2 = "0.10"
# Deflate for the virtual geometry build cache (already in the tree through png).
miniz_oxide = "0.8"
# BC1/BC4/BC5/BC7 compression of material images on the GPU (a WGSL port of Intel's ISPC
# texture compressor kernels; MIT).
block_compression = { version = "0.11", default-features = false, features = ["bc15", "bc7", "wgpu"] }
# CPU time of the render thread (`render.record_cpu_ms`), to tell its work from its waits.
cpu-time = "1"

# DX12: compile shaders with a statically linked DXC (mach-dxcompiler: MIT/Apache-2.0 around
# DXC's LLVM-licensed code, no proprietary dxil.dll) instead of FXC, which takes seconds on the
# large mesh shader. wgpu's default `Dx12Compiler::Auto` picks it when built in.
[target.'cfg(all(windows, target_env = "msvc", not(target_arch = "aarch64")))'.dependencies]
wgpu = { workspace = true, features = ["static-dxc"] }

[dev-dependencies]
image.workspace = true
