[package]
name = "engine_audio"
description = "Spatial audio: procedural footsteps and impacts from surface materials, rain and wind ambience, reverb, slow motion pitch, device and offline output."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Play through the sound card on Linux. Needs the ALSA headers (`apt install libasound2-dev`).
# Windows and macOS always have device output; without it Linux renders offline only.
alsa = ["dep:cpal"]

[dependencies]
engine_core.workspace = true
engine_world.workspace = true
engine_render.workspace = true
bevy_ecs.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
cpal = { version = "0.18", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18"

[dev-dependencies]
image.workspace = true
