[package]
name = "editor"
description = "The engine's editor: scene view with a fly camera, outliner, inspector over the type registry, move/rotate/scale gizmos, undo, scenes saved as data and play in editor with every module's demo."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
engine.workspace = true
bevy_ecs.workspace = true
serde.workspace = true
serde_json.workspace = true
bytemuck.workspace = true
# Offline geometry for fitted colliders (convex hulls, V-HACD); the simulation stays behind
# engine_world's physics contracts.
rapier3d.workspace = true
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock = "0.21"
transform-gizmo-egui = "0.11"
# FBX and OBJ import (MIT or Unlicense), the same library Godot 4.3+ uses.
ufbx = "0.11.5"
# Converting FBX textures (TGA, BMP, TIFF, DDS) to PNG at import.
image = { workspace = true, features = ["tga", "bmp", "tiff", "dds"] }
# The import preview reads glTF files' contents.
gltf.workspace = true
engine_physics.workspace = true
engine_vehicles.workspace = true
engine_space.workspace = true
engine_terrain.workspace = true
engine_water.workspace = true
engine_weather.workspace = true
engine_fire.workspace = true
engine_smoke.workspace = true
engine_vfx.workspace = true
engine_foliage.workspace = true
engine_anim.workspace = true
engine_npc.workspace = true
engine_destruction.workspace = true
engine_movement.workspace = true
engine_audio.workspace = true
engine_softbody.workspace = true
engine_script.workspace = true

[dev-dependencies]
# The glyph test reads egui's built-in fonts directly.
epaint_default_fonts = "0.36"
ttf-parser = "0.25"
