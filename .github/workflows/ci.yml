name: CI

# Changes to the player wiki alone (wiki/) don't build the engine; the Wiki workflow checks them.
on:
  pull_request:
    paths-ignore: ["wiki/**"]
  push:
    branches: [main]
    paths-ignore: ["wiki/**"]

# A new push to a pull request replaces the run on its old head. On main the running check
# always finishes and only a queued one gives way to a newer merge: with merges minutes apart,
# cancelling every run left main untested for hours (3 finished runs in 40 merges on
# 2026-10-12), so a break between two merged pull requests went unnoticed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Render tests run on lavapipe (Mesa's software Vulkan) and must not skip.
  ENGINE_REQUIRE_GPU: "1"
  # No debug info in CI builds. With it, the ~70 test, example and game binaries (each
  # linking wgpu, naga and bevy_ecs) filled the runner's disk and the linker died with
  # "signal 7 [Bus error]". Panic messages still name the file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    # The tests run in shards side by side. In one job `cargo test --workspace` took 45 to
    # 60 minutes on 2026-10-19 (8 minutes building, the rest running ~130 test binaries one
    # after another, most of them rendering on lavapipe), so a slow runner hit the timeout.
    # `heavy` holds the crates with the longest-running tests (NPC art renders alone took 20
    # minutes); `rest` is every other crate plus format and lint. Move a crate across when one
    # half grows much longer than the other. By 2026-11-04 `rest` ran 62-75 minutes (32 of
    # its 48 test minutes were engine_render's renders on lavapipe) and hit the timeout, so
    # engine_render has its own shard. That shard then took 42 minutes (40 of them its 64 test
    # binaries, one after another) while `heavy` took 14, so engine_render's tests are split in
    # two by `scripts/ci-render-tests` (its longest binaries, then the rest) and engine_physics
    # (proving_ground alone ran 5 minutes) moved from `rest` to `heavy`.
    name: Tests (${{ matrix.shard }})
    # Pinned: ubuntu-latest became 26.04 on 2026-11-09, and its lavapipe (mesa 26.0.8) crashed
    # every headless render test binary (SIGSEGV) that passed on 24.04's mesa 25.2.8.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: heavy
            packages: -p engine_npc -p engine_softbody -p engine_vehicles -p engine_physics
            lint: false
          - shard: render
            packages: -p engine_render $(scripts/ci-render-tests slow)
            after: -p engine_render --doc
            lint: false
          - shard: render-other
            packages: -p engine_render $(scripts/ci-render-tests other)
            lint: false
          - shard: rest
            packages: --workspace --exclude engine_npc --exclude engine_softbody --exclude engine_vehicles --exclude engine_physics --exclude engine_render
            lint: true
    steps:
      - name: Free disk space
        # Preinstalled SDKs this workspace never uses (Android, .NET, Haskell, CodeQL) take
        # many GB. They are deleted in the background while the next steps install and
        # restore; "Disk left" at the end shows the headroom.
        run: |
          df -h /
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift >/dev/null 2>&1 &
      - uses: actions/checkout@v4
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libwayland-dev libxkbcommon-dev
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.shard }}
      - name: Format
        if: matrix.lint
        run: cargo fmt --all --check
      - name: Lint
        if: matrix.lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test ${{ matrix.packages }}
          if [ -n "${{ matrix.after }}" ]; then cargo test ${{ matrix.after }}; fi
      - name: Disk left
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  result:
    # One check under the name pull requests and merge scripts wait for: green only when every
    # shard passed.
    name: Format, lint and test
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed
        run: test "${{ needs.check.result }}" = success
