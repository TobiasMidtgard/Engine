# Owner: CC0 scans thread (scan library for Foliage to adopt; see engine-design/megascans.md).
# Format and rules: AGENTS.md, "Art and large files". Fetch with `cargo run -p fetch-assets -- scans`.
# Zips (`unpack = "pbr"`) unpack next to themselves as <folder>_{diff,nor_gl,arm,disp}_2k.jpg, and
# atlases with an opacity map as <folder>_diff_2k.png with the opacity in alpha.

