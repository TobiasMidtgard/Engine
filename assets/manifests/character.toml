# Owner: Character creator. The morphable human behind every character face.
# Format and rules: AGENTS.md, "Art and large files". Fetch with `cargo run -p fetch-assets`.
#
# Baked by crates/character/tools/bake_makehuman.py from MakeHuman's CC0 assets: the hm08 base
# mesh (in meters) and its face, neck and torso shape targets plus the macro targets (sex, age,
# muscle, weight, height, proportions, ancestry), the facial expression units, and the default
# skeleton's weights folded onto anim's humanoid bones. Without this file characters aren't
# drawn and the creator says how to fetch it. (Version 2; old checkouts fetch human_hm08.bin.)

