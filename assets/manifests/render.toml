# Owner: Rendering and lighting. Scanned materials for streamed virtual texturing
# (crates/render/src/virtual_texture, the virtual_texturing example). Format and rules:
# AGENTS.md, "Art and large files". Fetch with `cargo run -p fetch-assets -- render`.
# Code falls back to procedural textures when these are missing; the renderer bakes a
# tiled copy next to each scan (`<file>.vtex`) the first time it streams it.

