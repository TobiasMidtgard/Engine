# Owner: Animation system. People and motion capture for the animation paddock.
# Format and rules: AGENTS.md, "Art and large files". Fetch with `cargo run -p fetch-assets`.
#
# Converted from the Microsoft Rocketbox Avatar Library (MIT, Copyright (c) 2020 Microsoft):
# FBX2glTF to GLB (meters, +Y up), materials rebuilt from the library's textures (roughness
# from its specular maps), meshes Phong-tessellated x4 (28k-33k triangles) with the same
# skeleton, UVs and weights, normal maps re-encoded as JPEG. Clips are 30 fps, one per file.
# Without these files the paddock's people fall back to their generated bodies.

